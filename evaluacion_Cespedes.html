<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Evaluación JavaScript</title>
</head>

<body>
    <h1>Evaluación de Contenido Avanzado</h1>
    <p>Revisa el resultado en la consola del navegador.</p>

    <script>
        const productos = [
            { id: 1, nombre: "Hamburguesa", precio: 28, stock: 8 },
            { id: 2, nombre: "Pizza personal", precio: 32, stock: 6 },
            { id: 3, nombre: "Ensalada", precio: 24, stock: 7 },
            { id: 4, nombre: "Refresco", precio: 10, stock: 15 },
            { id: 5, nombre: "Cafe", precio: 12, stock: 12 }
        ];

        const pedidos = [
            {
                id: 101,
                cliente: "Ana",
                tipoCliente: "regular",
                zona: "A",
                items: [
                    { productoId: 1, cantidad: 2 },
                    { productoId: 4, cantidad: 2 }
                ]
            },
            {
                id: 102,
                cliente: "Bruno",
                tipoCliente: "estudiante",
                zona: "B",
                items: [
                    { productoId: 2, cantidad: 1 },
                    { productoId: 5, cantidad: 1 }
                ]
            },
            {
                id: 103,
                cliente: "Carla",
                tipoCliente: "frecuente",
                items: [
                    { productoId: 3, cantidad: 2 },
                    { productoId: 4, cantidad: 1 },
                    { productoId: 5, cantidad: 1 }
                ]
            },
            {
                id: 104,
                cliente: "Diego",
                tipoCliente: "regular",
                zona: "A",
                items: [
                    { productoId: 1, cantidad: 1 },
                    { productoId: 2, cantidad: 2 }
                ]
            },
            {
                id: 105,
                cliente: "Elena",
                tipoCliente: "estudiante",
                zona: "B",
                items: [
                    { productoId: 3, cantidad: 1 },
                    { productoId: 4, cantidad: 3 }
                ]
            },
            {
                id: 106,
                cliente: "Fabian",
                tipoCliente: "frecuente",
                zona: "C",
                items: [
                    { productoId: 1, cantidad: 3 },
                    { productoId: 5, cantidad: 2 }
                ]
            }
        ];

        function buscarProducto(id) {
            const prod = productos.find(p => p.id === id);
            return prod ? prod : null;
        }
        function calcularSubtotal(pedido) {
            let subtotal = 0;
            for (let i = 0; i < pedido.items.length; i++) {
                const item = pedido.items[i];
                const prod = buscarProducto(item.productoId);
                if (prod) {
                    subtotal += prod.precio * item.cantidad;
                }
            }
            return subtotal;
        }
        function calcularDescuento(pedido, subtotal) {
            let porcentaje = 0;

            if (pedido.tipoCliente === "estudiante") {
                porcentaje = 10;
            } else if (pedido.tipoCliente === "frecuente") {
                porcentaje = 7;
            } else if (pedido.tipoCliente === "regular") {
                porcentaje = 0;
            }

            if (subtotal >= 120) {
                porcentaje += 3;
            }

            if (porcentaje > 15) {
                porcentaje = 15;
            }

            const montoDescuento = subtotal * (porcentaje / 100);
            const totalFinal = subtotal - montoDescuento;

            return {
                porcentaje: porcentaje,
                montoDescuento: montoDescuento,
                totalFinal: totalFinal
            };
        }

        function calcularEnvio(pedido, totalAntesEnvio) {
            if (totalAntesEnvio >= 120) {
                return 0;
            }

            switch (pedido.zona) {
                case "A": return 5;
                case "B": return 8;
                case "C": return 12;
                default: return 0;
            }
        }
        function calcularFidelizacion(totalAntesEnvio) {
            const puntos = Math.floor(totalAntesEnvio / 10);
            let nivel = "Bronce";

            if (puntos >= 30) {
                nivel = "Oro";
            } else if (puntos >= 20) {
                nivel = "Plata";
            } else {
                nivel = "Bronce";
            }

            return { puntos, nivel };
        }
        function generarReporteGeneral() {
            let ventasAntesEnvioTotal = 0;
            let recaudacionEnviosTotal = 0;
            let totalGeneralCobrado = 0;

            const clientesMapa = {};

            console.log("===============================");
            console.log("     REPORTES DE PEDIDOS");


            for (let i = 0; i < pedidos.length; i++) {
                const pedido = pedidos[i];

                const subtotal = calcularSubtotal(pedido);
                const descInfo = calcularDescuento(pedido, subtotal);
                const totalAntesEnvio = descInfo.totalFinal;
                const costoEnvio = calcularEnvio(pedido, totalAntesEnvio);
                const totalAPagar = totalAntesEnvio + costoEnvio;
                const fidelidad = calcularFidelizacion(totalAntesEnvio);

                ventasAntesEnvioTotal += totalAntesEnvio;
                recaudacionEnviosTotal += costoEnvio;
                totalGeneralCobrado += totalAPagar;

                if (!clientesMapa[pedido.cliente]) {
                    clientesMapa[pedido.cliente] = {
                        pedidosCount: 0,
                        gastadoTotal: 0
                    };
                }
                clientesMapa[pedido.cliente].pedidosCount += 1;
                clientesMapa[pedido.cliente].gastadoTotal += totalAntesEnvio;

                console.log(` Pedido ${pedido.id} – ${pedido.cliente} `);
                console.log(`Subtotal:   Bs ${subtotal.toFixed(2)} | Descuento: ${descInfo.porcentaje}% = Bs ${descInfo.montoDescuento.toFixed(2)}`);
                console.log(`Total:      Bs ${totalAntesEnvio.toFixed(2)} | Envío zona ${pedido.zona || 'N/A'}: Bs ${costoEnvio.toFixed(2)}`);
                console.log(`A pagar:    Bs ${totalAPagar.toFixed(2)} | Puntos: ${fidelidad.puntos}`);
                console.log(`Nivel:      ${fidelidad.nivel}\n`);
            }

            console.log("==============================");
            console.log("     REPORTE POR CLIENTE");


            for (const cliente in clientesMapa) {
                const datos = clientesMapa[cliente];
                const fidelidadCliente = calcularFidelizacion(datos.gastadoTotal);

                console.log(` Cliente – ${cliente} `);
                console.log(`Pedidos: ${datos.pedidosCount}  | Nivel:  ${fidelidadCliente.nivel}`);
                console.log(`Gastado: Bs ${datos.gastadoTotal.toFixed(2)} | Puntos: ${fidelidadCliente.puntos}\n`);
            }

            console.log("============================");
            console.log("      TOTALES GENERALES");
            console.log(`Ventas antes del envío: Bs ${ventasAntesEnvioTotal.toFixed(2)}`);
            console.log(`Recaudación por envíos: Bs ${recaudacionEnviosTotal.toFixed(2)}`);
            console.log(`Total General:          Bs ${totalGeneralCobrado.toFixed(2)}`);
        }

        generarReporteGeneral();
    </script>
</body>

</html>
