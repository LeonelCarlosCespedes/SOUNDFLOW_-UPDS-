<body> 
    <h1>Evaluación de Contenido Avanzado</h1> 
    <p>Revisa el resultado en la consola del navegador.</p> 
    <script> 
        const productos = [ 
            { id: 1, nombre: "Hamburguesa", precio: 28, stock: 8 }, 
            { id: 2, nombre: "Pizza personal", precio: 32, stock: 6 }, 
            { id: 3, nombre: "Ensalada", precio: 24, stock: 7 }, 
            { id: 4, nombre: "Refresco", precio: 10, stock: 15 }, 
            { id: 5, nombre: "Cafe", precio: 12, stock: 12 } 
        ]; 
        const pedidos = [ 
            { 
                id: 101, 
                cliente: "Ana", 
                tipoCliente: "regular", 
                zona: "A", 
                items: [ 
                    { productoId: 1, cantidad: 2 }, 
                    { productoId: 4, cantidad: 2 } 
                ] 
            }, 
            { 
                id: 102, 
                cliente: "Bruno", 
                tipoCliente: "estudiante", 
                zona: "B", 
                items: [ 
                    { productoId: 2, cantidad: 1 }, 
                    { productoId: 5, cantidad: 1 } 
                ] 
            }, 
            { 
                id: 103, 
                cliente: "Carla", 
                tipoCliente: "frecuente", 
                zona: "C", 
                items: [ 
                    { productoId: 3, cantidad: 2 }, 
                    { productoId: 4, cantidad: 1 }, 
                    { productoId: 5, cantidad: 1 } 
                ] 
            }, 
            { 
                id: 104, 
                cliente: "Diego", 
                tipoCliente: "regular", 
                zona: "A", 
                items: [ 
                    { productoId: 1, cantidad: 1 }, 
                    { productoId: 2, cantidad: 2 } 
                ] 
            }, 
            { 
                id: 105, 
                cliente: "Elena", 
                tipoCliente: "estudiante", 
                zona: "B", 
                items: [ 
                    { productoId: 3, cantidad: 1 }, 
                    { productoId: 4, cantidad: 3 } 
                ] 
            }, 
            { 
                id: 106, 
                cliente: "Fabian", 
                tipoCliente: "frecuente", 
                zona: "C", 
                items: [ 
                    { productoId: 1, cantidad: 3 }, 
                    { productoId: 5, cantidad: 2 } 
                ] 
            } 
        ]; 
        // 4.1 Buscar producto
function buscarProducto(id) {
    const producto = productos.find(function(producto) {
        return producto.id === id;
    });

    return producto || null;
}

// 4.2 Calcular subtotal
function calcularSubtotal(pedido) {
    let subtotal = 0;

    pedido.items.forEach(function(item) {
        const producto = buscarProducto(item.productoId);

        if (producto !== null) {
            subtotal += producto.precio * item.cantidad;
        }
    });

    return subtotal;
}

// 4.3 Reglas comerciales
function calcularDescuento(pedido, subtotal) {
    let porcentajeDescuento = 0;

    if (pedido.tipoCliente === "estudiante") {
        porcentajeDescuento = 10;
    } else if (pedido.tipoCliente === "frecuente") {
        porcentajeDescuento = 7;
    }

    if (subtotal >= 120) {
        porcentajeDescuento += 3;
    }

    if (porcentajeDescuento > 15) {
        porcentajeDescuento = 15;
    }

    const montoDescuento = subtotal * porcentajeDescuento / 100;
    const totalAntesEnvio = subtotal - montoDescuento;

    return {
        subtotal,
        porcentajeDescuento,
        montoDescuento,
        totalAntesEnvio
    };
}

// 4.4 Costo de envío
function calcularEnvio(pedido, totalAntesEnvio) {
    if (totalAntesEnvio >= 120) {
        return 0;
    }

    if (pedido.zona === "A") return 5;
    if (pedido.zona === "B") return 8;
    if (pedido.zona === "C") return 12;

    return 0;
}

    </script>
